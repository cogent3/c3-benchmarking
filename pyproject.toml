[build-system]
requires = ["uv_build>=0.5,<0.6"]
build-backend = "uv_build"

[project]
name = "c3bench"
version = "0.1.0"
description = "Benchmarking utilities for cogent3."
authors = [{ name = "Gavin Huttley", email = "Gavin.Huttley@anu.edu.au" }]
keywords = [
    "biology",
    "genomics",
    "statistics",
    "phylogeny",
    "evolution",
    "bioinformatics",
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "click",
    "rich",
    "biopython",
    "psrecord",
    "scikit-bio",
    "cogent3[extra]",
    "cogent3-h5seqs>=0.9.0",
    "pympler>=1.1",
    "bcbio-gff>=0.7.1",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
]
[project.scripts]
c3bench = "c3bench:main"

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "pytest-xdist", "nox"]
dev = ["ruff", "c3bench[test]", "line-profiler"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "-ra"]
testpaths = "tests"

[tool.uv.build-backend]
module-name = "c3bench"
module-root = "src"
source-include = ["doc/**", "src/**", "pyproject.toml"]
source-exclude = ["doc/*.html"]

[dependency-groups]
dev = ["biopython>=1.85", "psrecord>=1.4", "scikit-bio>=0.7.0"]
